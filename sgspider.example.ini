[main]
username = myuser
password = mypass

[settings]
# Run browser in headless mode (true/false)
headless = true

# Maximum retry attempts for failed operations
max_retries = 3

# Base delay in seconds between retries (exponential backoff). A 429/503 with a
# Retry-After header waits as long as the server asks instead.
retry_base_delay = 5

# Upper bound in seconds for any single backoff / Retry-After wait
max_backoff = 60

# Timeout for image downloads in milliseconds
download_timeout = 30000

# Timeout for page loads in milliseconds
page_load_timeout = 60000

# Limit album loading scroll iterations (0 = unlimited)
max_album_pages = 0

# Restart browser every N opened albums to free memory (0 = disabled)
browser_restart_interval = 50

# Album feed period used for /photos/sg/recent/<period>/ ("all" = whole feed,
# "30" = last 30 days, which is much faster for a daily run)
recent_period = 30

# Parallel image downloads. Images come from the external CDN (not the main
# site), fetched with the logged-in browser's cookies over plain HTTP.
download_concurrency = 8

# Optional pause between album page loads, in seconds (random between min and
# max). 0 = none; pages are waited on by condition, not by fixed sleeps.
album_delay_min = 0
album_delay_max = 0

# Skip albums already downloaded completely (remembered in .sgspider.albums.json
# next to the script) without opening their page. The album folder is still
# listed once to confirm every file is there.
skip_completed_albums = true

# Don't load images/fonts/media in the browser (pages are only read for links)
block_page_assets = true

# Feed loading: how long (ms) to wait for more albums after Load more / scroll,
# and how many attempts that load nothing before the feed counts as finished
feed_wait_timeout = 5000
feed_max_idle = 2

# How long (ms) to wait for an album page's photo links to appear
album_wait_timeout = 15000
